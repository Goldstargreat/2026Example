<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Team / Player 목록</title>
</head>
<body>

<h2>선수 추가</h2>
<form th:action="@{/exam14_04/player}" method="post">
    선수 이름 <input type="text" name="name" required>
    소속 팀
    <select name="teamId">
        <option th:each="team : ${teamList}"
                th:value="${team.id}"
                th:text="${team.name}"></option>
    </select>
    <button type="submit">추가</button>
</form>

<h2>팀 추가</h2>
<form th:action="@{/exam14_04/team}" method="post">
    팀 이름 <input type="text" name="name" required>
    <button type="submit">추가</button>
</form>

<h2>팀(Team) 목록</h2>
<table border="1">
    <thead>
    <tr><th>ID</th><th>팀 이름</th></tr>
    </thead>
    <tbody>
    <tr th:each="team : ${teamList}">
        <td th:text="${team.id}"></td>
        <td th:text="${team.name}"></td>
    </tr>
    </tbody>
</table>

<h2>선수(Player) 목록</h2>
<table border="1">
    <thead>
    <tr><th>ID</th><th>선수 이름</th><th>소속 팀</th></tr>
    </thead>
    <tbody>
    <tr th:each="player : ${playerList}">
        <td th:text="${player.id}"></td>
        <td th:text="${player.name}"></td>
        <td th:text="${player.team?.name}"></td>
    </tr>
    </tbody>
</table>

</body>
</html>
